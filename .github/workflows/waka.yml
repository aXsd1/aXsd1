name: WakaTime Stats Update

on:
  schedule:
    # Her gün Türkiye saatiyle 03:00'te (00:00 UTC) otomatik çalışır
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Update README with WakaTime
    runs-on: ubuntu-latest
    steps:
      - name: WakaTime İstatistiklerini Güncelle
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_TITLE: "false"
          SHOW_TIME: "true"
          SHOW_TOTAL: "true"
          SHOW_MASKED_TIME: "false"
          STOP_AT_OTHER: "true"
          COMMIT_BY_ME: "true"
          COMMIT_MESSAGE: "chore: WakaTime istatistikleri güncellendi"